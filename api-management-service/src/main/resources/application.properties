spring.application.name=api-management-service
server.port=8081
info.app.name=Api Management Service
info.app.description=Custom API gateway
spring.datasource.url = jdbc:mysql://localhost:3306/GateKeeper_management
spring.datasource.username = root
spring.datasource.password = nishant123
spring.jpa.hibernate.ddl-auto=validate
# Enable Flyway
spring.flyway.enabled=true

# Authorize Flyway to wipe the database if validation fails
spring.flyway.clean-on-validation-error=true

# CRITICAL: Explicitly permit Flyway to run the clean command
spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
